name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Install MoonBit
        run: |
          set -euo pipefail
          export MOON_HOME="$RUNNER_TEMP/moonbit"
          installer="$RUNNER_TEMP/install-moonbit.sh"
          curl --fail --silent --show-error --location --retry 3 https://cli.moonbitlang.com/install/unix.sh --output "$installer"
          bash "$installer"
          echo "$MOON_HOME/bin" >> "$GITHUB_PATH"
          echo "MOON_HOME=$MOON_HOME" >> "$GITHUB_ENV"
      - run: moon version --all
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:native
      - run: pnpm test:host
      - run: pnpm build
